<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container {
      text-align: center;
    }
    button {
      background-color: #7C3AED;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #6D28D9;
    }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    .success {
      background-color: #D1FAE5;
      color: #065F46;
    }
    .error {
      background-color: #FEE2E2;
      color: #991B1B;
    }
    .tip {
      font-size: 12px;
      color: #444;
      margin-top: 10px;
    }
    kbd {
      background: #E5E7EB;
      padding: 1px 4px;
      border-radius: 3px;
    }
    a {
      color: #7C3AED;
    }
    .version {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>RightKey to Obsidian Pro</h2>
    <p>选中文本后右键点击"发送到 Obsidian"即可保存</p>
    <div id="status" class="status"></div>
    <div class="tip">快捷键：<kbd id="shortcut">未设置</kbd>（<a href="#" id="editShortcut">修改</a>）</div>
    <button id="openOptions">打开设置</button>
    <div class="version">版本 2.1</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
